name: CI

# When to run: every push to main, and every pull request targeting main
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest   # a fresh Linux machine every run

    steps:
      # 1. Download your repo's code onto the runner
      - uses: actions/checkout@v5

      # 2. Install Python (the runner starts with nothing set up for you)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip          # reuses downloaded packages to speed up later runs

      # 3. Same install commands you ran locally
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # 4. The three checks from Step 4
      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Run tests
        run: pytest -v